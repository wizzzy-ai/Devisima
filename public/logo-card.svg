<svg xmlns="http://www.w3.org/2000/svg" width="512" height="768" viewBox="0 0 512 768">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#294b40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#174c43;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="768" fill="#f7f8ee"/>

  <!-- Logo icon centered -->
  <g transform="translate(156, 234)">
    <!-- Outer bracket shape forming D -->
    <path d="M 40 0 L 40 300 L 80 300 L 80 180 L 140 180 C 170 180 200 150 200 120 C 200 90 170 60 140 60 L 40 60 Z M 80 100 L 140 100 C 150 100 160 110 160 120 C 160 130 150 140 140 140 L 80 140 L 80 100 Z" fill="url(#grad1)"/>
    <!-- Small accent dots representing code -->
    <circle cx="220" cy="60" r="10" fill="#236b5e"/>
    <circle cx="220" cy="150" r="10" fill="#236b5e"/>
    <circle cx="220" cy="240" r="10" fill="#236b5e"/>
  </g>

  <!-- Text "Devisima" -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#294b40" text-anchor="middle">Devisima</text>

  <!-- Tagline -->
  <text x="256" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#52645b" text-anchor="middle">Good ideas deserve great software</text>
</svg>
