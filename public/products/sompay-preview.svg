<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" fill="none">
  <!-- Background with subtle warm gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="60%" stop-color="#F7F3EB" />
      <stop offset="100%" stop-color="#EFE9DC" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C98B18" />
      <stop offset="100%" stop-color="#E5A62E" />
    </linearGradient>
    <linearGradient id="goldBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C98B18" />
      <stop offset="100%" stop-color="#B87B0E" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1A201C" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#bgGrad)" />

  <!-- Subtle background glow -->
  <circle cx="600" cy="220" r="320" fill="#FCEFD6" opacity="0.45" filter="blur(60px)" />

  <!-- Navigation Bar -->
  <g id="navbar">
    <rect x="0" y="0" width="1200" height="74" fill="none" />
    
    <!-- Logo / Brand -->
    <g transform="translate(90, 26)">
      <circle cx="12" cy="12" r="12" fill="#0F4C5C" />
      <path d="M7 12L11 16L17 9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="32" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F4C5C" letter-spacing="1">SOMPAY</text>
    </g>

    <!-- Nav Links -->
    <g transform="translate(390, 39)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#4B5563">
      <rect x="-14" y="-18" width="58" height="30" rx="8" fill="#F3EDE2" />
      <text x="0" y="0" font-weight="600" fill="#1F2937">Home</text>
      <text x="70" y="0">About</text>
      <text x="140" y="0">Services</text>
      <text x="225" y="0">Contact</text>
      <text x="305" y="0">Support</text>
    </g>

    <!-- Right Actions -->
    <g transform="translate(970, 24)">
      <rect x="-85" y="0" width="70" height="38" rx="8" fill="none" stroke="#E5E7EB" />
      <text x="-50" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#374151">Login</text>
      
      <rect x="0" y="0" width="130" height="38" rx="8" fill="url(#goldBtn)" />
      <text x="54" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Get Started</text>
      <path d="M102 20L108 20M108 20L105 17M108 20L105 23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Hero Content -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Trust Pill -->
    <g transform="translate(0, 0)">
      <rect x="-165" y="0" width="330" height="34" rx="17" fill="#FEF6E4" stroke="#F8DFAC" stroke-width="1.2" />
      <circle cx="-140" cy="17" r="4" fill="#C98B18" />
      <text x="4" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#925E09" letter-spacing="0.2">
        Trusted by 10,000+ businesses worldwide
      </text>
    </g>

    <!-- Main Headline -->
    <text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#141916" letter-spacing="-0.8">
      Payment Solutions
    </text>
    <text y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#goldText)" letter-spacing="-0.8">
      Built for Growth
    </text>

    <!-- Subtitle -->
    <text y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#5F6762" width="600">
      <tspan x="0" dy="0">Accept payments globally with enterprise-grade security, lightning-fast</tspan>
      <tspan x="0" dy="24">processing, and powerful analytics. Scale your business with confidence.</tspan>
    </text>

    <!-- Category Tag -->
    <g transform="translate(0, 252)">
      <rect x="-70" y="0" width="140" height="30" rx="15" fill="#0F4C5C" />
      <text x="0" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">
        Business Systems
      </text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 302)">
      <rect x="-160" y="0" width="150" height="46" rx="10" fill="url(#goldBtn)" />
      <text x="-94" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
        Start Free Trial
      </text>
      <path d="M-28 24L-22 24M-22 24L-25 21M-22 24L-25 27" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <rect x="10" y="0" width="150" height="46" rx="10" fill="#FFFFFF" stroke="#D7BA80" stroke-width="1.5" />
      <text x="85" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#6B5120">
        Schedule Demo
      </text>
    </g>
  </g>

  <!-- Dashboard Mockup Peek at Bottom -->
  <g transform="translate(250, 550)" filter="url(#cardShadow)">
    <rect width="700" height="230" rx="16" fill="#FFFFFF" stroke="#EAE5DB" stroke-width="1.5" />
    
    <!-- Dashboard header inside mockup -->
    <rect x="0" y="0" width="700" height="44" rx="16" fill="#FAF8F5" />
    <circle cx="28" cy="22" r="4" fill="#E2DDD5" />
    <circle cx="42" cy="22" r="4" fill="#E2DDD5" />
    <circle cx="56" cy="22" r="4" fill="#E2DDD5" />
    <rect x="250" y="12" width="200" height="20" rx="6" fill="#FFFFFF" stroke="#EFEBE4" />
    <text x="350" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A8A29E">sompay.io/dashboard</text>

    <!-- Stat cards inside mockup -->
    <g transform="translate(30, 64)">
      <rect x="0" y="0" width="195" height="100" rx="10" fill="#FBF9F6" stroke="#EFEBE4" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#78716C">Total Revenue</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0F4C5C">$248,590</text>
      <text x="16" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#16A34A">+18.4% vs last month</text>
    </g>

    <g transform="translate(245, 64)">
      <rect x="0" y="0" width="195" height="100" rx="10" fill="#FBF9F6" stroke="#EFEBE4" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#78716C">Active Transactions</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#1F2937">14,280</text>
      <text x="16" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#16A34A">99.98% success rate</text>
    </g>

    <g transform="translate(460, 64)">
      <rect x="0" y="0" width="205" height="100" rx="10" fill="#FBF9F6" stroke="#EFEBE4" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#78716C">Global Settlements</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#C98B18">134 Countries</text>
      <text x="16" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#78716C">Instant FX conversion</text>
    </g>
  </g>
</svg>